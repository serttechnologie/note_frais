
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Notes de Frais</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F5F2EC;--surface:#fff;--border:#E0DBD0;--text:#1C1915;--text2:#6B6357;
  --accent:#1E4D2B;--accent-light:#E8F0EB;--danger:#C0392B;--radius-sm:10px;--radius:16px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#141210;--surface:#1E1C19;--border:#2E2B26;--text:#F0EDE6;--text2:#8C8479;--accent:#2E7D45;--accent-light:#1A2E1E}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:430px;margin:0 auto}

/* HEADER */
.header{background:var(--accent);padding:env(safe-area-inset-top,0) 20px 16px;padding-top:calc(env(safe-area-inset-top,0)+16px)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.logo{font-family:'DM Serif Display',serif;font-size:22px;color:#fff}
.header-actions{display:flex;gap:10px;align-items:center}
.drive-btn{position:relative;height:44px;padding:0 14px;border-radius:100px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;cursor:pointer;font-family:inherit}
.drive-btn:active{background:rgba(255,255,255,.28)}
.status-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);flex-shrink:0;transition:background .4s}
.status-dot.connected{background:#4ADE80;box-shadow:0 0 0 2px rgba(74,222,128,.3)}
.status-dot.syncing{background:#FCD34D;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.total-card{background:rgba(255,255,255,.12);border-radius:var(--radius);padding:14px 18px;border:1px solid rgba(255,255,255,.15)}
.total-label{font-size:12px;color:rgba(255,255,255,.7);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.total-amount{font-size:32px;font-weight:600;color:#fff;line-height:1}
.total-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}

/* MAIN */
.main{padding:16px}
.section-title{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;margin:16px 0 10px}

/* FORM */
.form-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:6px}
.form-card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none}
.form-card-title{font-size:15px;font-weight:600}
.chevron{font-size:18px;color:var(--text2);transition:transform .2s}
.chevron.open{transform:rotate(180deg)}
.form-body{padding:0 16px 16px;display:none;flex-direction:column;gap:10px}
.form-body.open{display:flex}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-label{font-size:12px;font-weight:500;color:var(--text2)}
input[type=text],input[type=date],input[type=number]{width:100%;height:48px;padding:0 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;color:var(--text);font-family:inherit;outline:none;transition:border .15s;-webkit-appearance:none;appearance:none}
input:focus{border-color:var(--accent)}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cat-btn{height:44px;border-radius:var(--radius-sm);background:var(--bg);border:1.5px solid var(--border);color:var(--text);font-size:14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.cat-btn.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:600}

/* PIÈCES JOINTES */
.attach-row{display:flex;gap:8px}
.attach-btn{flex:1;height:48px;border-radius:var(--radius-sm);background:var(--bg);border:1.5px dashed var(--border);color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:border-color .15s}
.attach-btn:active{border-color:var(--accent);color:var(--accent)}
input[type=file]{display:none}
.thumb-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb-del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}
.add-btn{height:52px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:2px;transition:opacity .15s}
.add-btn:active{opacity:.8}

/* EXPENSE ITEMS */
.expense-item{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:8px;overflow:hidden}
.expense-main{padding:14px 16px;display:flex;align-items:center;gap:12px}
.cat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.cat-transport{background:#EAF3FE}.cat-repas{background:#FEF3E2}.cat-hebergement{background:#F0EFFE}.cat-divers{background:#F0F7EE}
.item-info{flex:1;min-width:0}
.item-desc{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{font-size:12px;color:var(--text2);margin-top:2px}
.item-right{display:flex;align-items:center;gap:6px}
.item-amount{font-size:16px;font-weight:600;white-space:nowrap}
.del-btn{width:36px;height:36px;border-radius:50%;background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.del-btn:active{background:#FFE8E8;color:var(--danger)}

/* PIÈCES SOUS L'ITEM */
.item-attachments{padding:0 14px 12px;display:flex;flex-wrap:wrap;gap:8px}
.item-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:pointer}
.attach-count{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px;padding:0 14px 10px}

/* PDF BUTTON */
.pdf-btn{width:100%;height:52px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);font-size:15px;font-weight:600;color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;transition:background .15s}
.pdf-btn:active{background:var(--accent-light)}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:none;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:12px;object-fit:contain}
.lightbox-close{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.4}
.empty-text{font-size:15px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1C1915;color:#fff;padding:10px 20px;border-radius:100px;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;z-index:300;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">Notes de Frais</div>
    <div class="header-actions">
      <button class="drive-btn" onclick="connect()" id="drive-btn">
        <span class="status-dot" id="status-dot"></span>
        <span id="drive-label">Drive</span>
      </button>
    </div>
  </div>
  <div class="total-card">
    <div class="total-label">Total du mois</div>
    <div class="total-amount" id="total">0,00 €</div>
    <div class="total-sub" id="count-label">0 dépense</div>
  </div>
</div>

<div class="main">

  <!-- FORMULAIRE -->
  <div class="form-card">
    <div class="form-card-header" onclick="toggleForm()">
      <span class="form-card-title">➕ Nouvelle dépense</span>
      <span class="chevron" id="chevron">▾</span>
    </div>
    <div class="form-body" id="form-body">
      <div class="input-group">
        <div class="input-label">Description</div>
        <input type="text" id="desc" placeholder="Ex : Taxi CDG, Déjeuner client…" autocomplete="off">
      </div>
      <div class="input-group">
        <div class="input-label">Date</div>
        <input id="date" type="date">
      </div>
      <div class="input-group">
        <div class="input-label">Montant TTC (€)</div>
        <input id="amount" type="number" inputmode="decimal" placeholder="0,00">
      </div>
      <div class="input-group">
        <div class="input-label">Catégorie</div>
        <div class="cat-grid">
          <button class="cat-btn active" id="cat-Transport" onclick="selectCat('Transport')">🚗 Transport</button>
          <button class="cat-btn" id="cat-Repas" onclick="selectCat('Repas')">🍽️ Repas</button>
          <button class="cat-btn" id="cat-Hébergement" onclick="selectCat('Hébergement')">🏨 Hébergement</button>
          <button class="cat-btn" id="cat-Divers" onclick="selectCat('Divers')">📦 Divers</button>
        </div>
      </div>

      <!-- PIÈCES JOINTES -->
      <div class="input-group">
        <div class="input-label">Justificatifs</div>
        <div class="attach-row">
          <button class="attach-btn" onclick="document.getElementById('cam-input').click()">📷 Photo</button>
          <button class="attach-btn" onclick="document.getElementById('file-input').click()">📎 Fichier</button>
        </div>
        <input type="file" id="cam-input" accept="image/*" capture="environment" onchange="addAttachment(event)">
        <input type="file" id="file-input" accept="image/*,application/pdf" multiple onchange="addAttachment(event)">
        <div class="thumb-list" id="thumb-list"></div>
      </div>

      <button class="add-btn" onclick="add()">Ajouter la dépense</button>
    </div>
  </div>

  <!-- LISTE -->
  <div class="section-title">Dépenses récentes</div>
  <div id="list"></div>

  <!-- PDF -->
  <button class="pdf-btn" onclick="generatePDF()">📄 Générer le rapport PDF du mois</button>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
</div>

<div class="toast" id="toast"></div>

<script>
const CLIENT_ID='510292526417-007bs9oh8tdif3hgkr4ov33ns7ctl5kq.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.file';
const FILE='notes_de_frais.json';

let token=null,fileId=null,client;
let expenses=JSON.parse(localStorage.getItem('ndf')||'[]');
let selectedCat='Transport',formOpen=false;
let pendingAttachments=[]; // {dataUrl, name}
let saveTimer;

const catIcons={Transport:'🚗',Repas:'🍽️',Hébergement:'🏨',Divers:'📦'};
const catBg={Transport:'cat-transport',Repas:'cat-repas',Hébergement:'cat-hebergement',Divers:'cat-divers'};

/* ---- ATTACHMENTS ---- */
function addAttachment(e){
  const files=[...e.target.files];
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      pendingAttachments.push({dataUrl:ev.target.result,name:file.name});
      renderThumbs();
    };
    reader.readAsDataURL(file);
  });
  e.target.value='';
}

function renderThumbs(){
  const list=document.getElementById('thumb-list');
  list.innerHTML=pendingAttachments.map((a,i)=>`
    <div class="thumb">
      <img src="${a.dataUrl}" alt="${a.name}" onclick="openLightbox('${a.dataUrl}')">
      <button class="thumb-del" onclick="removePending(${i})">×</button>
    </div>
  `).join('');
}

function removePending(i){
  pendingAttachments.splice(i,1);
  renderThumbs();
}

/* ---- LIGHTBOX ---- */
function openLightbox(src){
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}

/* ---- UI ---- */
function selectCat(c){
  selectedCat=c;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('cat-'+c)?.classList.add('active');
}
function toggleForm(){
  formOpen=!formOpen;
  document.getElementById('form-body').classList.toggle('open',formOpen);
  document.getElementById('chevron').classList.toggle('open',formOpen);
}
function updateTotal(){
  const total=expenses.reduce((s,e)=>s+(+e.amount),0);
  document.getElementById('total').textContent=total.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
  const n=expenses.length;
  document.getElementById('count-label').textContent=n+' dépense'+(n>1?'s':'');
}
function formatDate(d){
  if(!d)return'—';
  const[y,m,j]=d.split('-');return`${j}/${m}/${y}`;
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

/* ---- RENDER ---- */
function render(){
  const list=document.getElementById('list');
  if(!expenses.length){
    list.innerHTML=`<div class="empty"><div class="empty-icon">🧾</div><div class="empty-text">Aucune dépense pour l'instant</div></div>`;
    updateTotal();return;
  }
  list.innerHTML=[...expenses].reverse().map(e=>{
    const atts=e.attachments||[];
    const thumbsHtml=atts.length?`
      <div class="item-attachments">
        ${atts.slice(0,4).map(a=>`<img class="item-thumb" src="${a.dataUrl}" onclick="openLightbox('${a.dataUrl}')">`).join('')}
        ${atts.length>4?`<div style="font-size:12px;color:var(--text2);display:flex;align-items:center">+${atts.length-4}</div>`:''}
      </div>
    `:'';
    return`
    <div class="expense-item">
      <div class="expense-main">
        <div class="cat-icon ${catBg[e.cat]||'cat-divers'}">${catIcons[e.cat]||'📦'}</div>
        <div class="item-info">
          <div class="item-desc">${e.desc||'—'}</div>
          <div class="item-meta">${formatDate(e.date)} · ${e.cat}${atts.length?` · 📎 ${atts.length}`:''}</div>
        </div>
        <div class="item-right">
          <div class="item-amount">${(+e.amount).toLocaleString('fr-FR',{minimumFractionDigits:2})}&nbsp;€</div>
          <button class="del-btn" onclick="del(${e.id})" aria-label="Supprimer">×</button>
        </div>
      </div>
      ${thumbsHtml}
    </div>`;
  }).join('');
  updateTotal();
}

/* ---- CRUD ---- */
function add(){
  const d=document.getElementById('desc').value.trim();
  const dt=document.getElementById('date').value;
  const a=parseFloat(document.getElementById('amount').value);
  if(!d||!dt||isNaN(a)||a<=0){showToast('⚠️ Remplis tous les champs');return;}
  expenses.push({id:Date.now(),desc:d,date:dt,amount:a,cat:selectedCat,attachments:[...pendingAttachments]});
  localStorage.setItem('ndf',JSON.stringify(expenses));
  document.getElementById('desc').value='';
  document.getElementById('amount').value='';
  pendingAttachments=[];
  renderThumbs();
  render();autoSave();
  showToast('✅ Dépense ajoutée');
  if(formOpen)toggleForm();
}
function del(id){
  expenses=expenses.filter(e=>e.id!==id);
  localStorage.setItem('ndf',JSON.stringify(expenses));
  render();autoSave();
  showToast('🗑️ Supprimée');
}

/* ---- PDF ---- */
async function generatePDF(){
  if(!expenses.length){showToast('⚠️ Aucune dépense à exporter');return;}
  showToast('⏳ Génération du PDF…');

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210,margin=18,contentW=W-margin*2;
  const now=new Date();
  const monthName=now.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const total=expenses.reduce((s,e)=>s+(+e.amount),0);

  // ---- COULEURS ----
  const GREEN=[30,77,43];
  const LIGHT=[232,240,235];
  const DARK=[28,25,21];
  const GRAY=[107,99,87];

  // ---- EN-TÊTE ----
  doc.setFillColor(...GREEN);
  doc.rect(0,0,210,42,'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(22);
  doc.setTextColor(255,255,255);
  doc.text('Notes de Frais',margin,20);
  doc.setFontSize(12);
  doc.setFont('helvetica','normal');
  doc.text('Rapport mensuel — '+monthName,margin,30);
  doc.setFontSize(11);
  doc.text('Total : '+total.toLocaleString('fr-FR',{minimumFractionDigits:2})+' €',W-margin,30,{align:'right'});

  let y=54;

  // ---- PAR CATÉGORIE ----
  const cats=['Transport','Repas','Hébergement','Divers'];
  cats.forEach(cat=>{
    const items=expenses.filter(e=>e.cat===cat);
    if(!items.length)return;
    const catTotal=items.reduce((s,e)=>s+(+e.amount),0);

    // Sous-titre catégorie
    doc.setFillColor(...LIGHT);
    doc.roundedRect(margin,y,contentW,9,2,2,'F');
    doc.setFont('helvetica','bold');
    doc.setFontSize(10);
    doc.setTextColor(...GREEN);
    doc.text(cat,margin+4,y+6.2);
    doc.text(catTotal.toLocaleString('fr-FR',{minimumFractionDigits:2})+' €',W-margin-4,y+6.2,{align:'right'});
    y+=13;

    items.forEach((e,idx)=>{
      if(y>268){doc.addPage();y=20;}
      // ligne alternée
      if(idx%2===0){doc.setFillColor(250,249,246);doc.rect(margin,y-1,contentW,9,'F');}
      doc.setFont('helvetica','normal');
      doc.setFontSize(10);
      doc.setTextColor(...DARK);
      const desc=e.desc.length>38?e.desc.slice(0,36)+'…':e.desc;
      doc.text(desc,margin+2,y+5.5);
      doc.setTextColor(...GRAY);
      doc.text(formatDate(e.date),margin+90,y+5.5);
      doc.setTextColor(...DARK);
      doc.text((+e.amount).toLocaleString('fr-FR',{minimumFractionDigits:2})+' €',W-margin-2,y+5.5,{align:'right'});

      // indicateur pièce jointe
      if(e.attachments&&e.attachments.length){
        doc.setFontSize(7);
        doc.setTextColor(...GRAY);
        doc.text('📎 '+e.attachments.length,margin+116,y+5.5);
      }
      y+=9;

      // Insérer images (tickets de caisse)
      if(e.attachments&&e.attachments.length){
        e.attachments.forEach(att=>{
          if(!att.dataUrl.startsWith('data:image'))return;
          if(y+42>270){doc.addPage();y=20;}
          try{
            const fmt=att.dataUrl.includes('png')?'PNG':'JPEG';
            doc.addImage(att.dataUrl,fmt,margin+4,y,40,36);
            y+=40;
          }catch(err){}
        });
      }
    });
    y+=6;
  });

  // ---- TOTAL FINAL ----
  if(y>260){doc.addPage();y=20;}
  y+=4;
  doc.setDrawColor(...GREEN);
  doc.setLineWidth(.5);
  doc.line(margin,y,W-margin,y);
  y+=8;
  doc.setFont('helvetica','bold');
  doc.setFontSize(12);
  doc.setTextColor(...GREEN);
  doc.text('TOTAL GÉNÉRAL',margin,y);
  doc.text(total.toLocaleString('fr-FR',{minimumFractionDigits:2})+' €',W-margin,y,{align:'right'});

  // ---- PIED DE PAGE ----
  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal');
    doc.setFontSize(8);
    doc.setTextColor(...GRAY);
    doc.text('Généré le '+new Date().toLocaleDateString('fr-FR'),margin,292);
    doc.text('Page '+i+'/'+pages,W-margin,292,{align:'right'});
  }

  const filename='notes-de-frais-'+now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0')+'.pdf';
  doc.save(filename);
  showToast('✅ PDF téléchargé !');
}

/* ---- DRIVE ---- */
function setDriveStatus(s){
  const dot=document.getElementById('status-dot');
  const lbl=document.getElementById('drive-label');
  dot.className='status-dot';
  if(s==='connected'){dot.classList.add('connected');lbl.textContent='Drive';}
  else if(s==='syncing'){dot.classList.add('syncing');lbl.textContent='Sync…';}
  else{lbl.textContent='Drive';}
}
function connect(){
  if(token){showToast('☁️ Déjà connecté');return;}
  if(typeof google==='undefined'){showToast('⚠️ SDK Google non chargé');return;}
  client=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,scope:SCOPES,
    callback:(r)=>{token=r.access_token;setDriveStatus('connected');load();}
  });
  client.requestAccessToken();
}
async function save(){
  if(!token)return;
  setDriveStatus('syncing');
  try{
    const blob=new Blob([JSON.stringify(expenses)],{type:'application/json'});
    if(fileId){
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+token},body:blob});
    }else{
      const form=new FormData();
      form.append('metadata',new Blob([JSON.stringify({name:FILE})],{type:'application/json'}));
      form.append('file',blob);
      const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+token},body:form});
      const d=await r.json();fileId=d.id;
    }
  }catch(e){showToast('❌ Erreur de sync');}
  setDriveStatus('connected');
}
async function load(){
  setDriveStatus('syncing');
  try{
    const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${FILE}'&fields=files(id)`,{headers:{Authorization:'Bearer '+token}});
    const d=await r.json();
    if(!d.files.length){setDriveStatus('connected');return;}
    fileId=d.files[0].id;
    const data=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,{headers:{Authorization:'Bearer '+token}});
    expenses=await data.json();
    localStorage.setItem('ndf',JSON.stringify(expenses));
    render();
  }catch(e){showToast('❌ Erreur de chargement');}
  setDriveStatus('connected');
  showToast('☁️ Synchronisé');
}
function autoSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,1200);}

document.getElementById('date').value=new Date().toISOString().split('T')[0];
render();
</script>
