<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes de Frais (Drive)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#F4F1EB;--surface:#fff;--border:#DDD8CC;--text:#1C1915;--text2:#6B6357;
  --accent:#1E4D2B;--accent2:#2E7D45;--radius:12px;--shadow:0 1px 6px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:DM Sans;background:var(--bg);color:var(--text)}
header{background:var(--accent);color:#fff;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:DM Serif Display;font-size:20px}
.btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer}
.container{max-width:1000px;margin:20px auto;display:grid;grid-template-columns:320px 1fr;gap:20px;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card h3{padding:14px 16px;border-bottom:1px solid var(--border);font-family:DM Serif Display}
.card .body{padding:14px 16px}
input,select{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px}
button.primary{width:100%;background:var(--accent);color:#fff;border:none;padding:10px;border-radius:8px;cursor:pointer}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border:1px solid var(--border);padding:10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.small{font-size:12px;color:var(--text2)}
.danger{color:#b00020;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="logo">📋 Notes de Frais</div>
  <div>
    <button class="btn" onclick="connect()">☁️ Drive</button>
    <button class="btn" onclick="save()">💾 Sauvegarder</button>
  </div>
</header>

<div class="container">

  <div class="card">
    <h3>Nouvelle dépense</h3>
    <div class="body">
      <input id="desc" placeholder="Description">
      <input id="date" type="date">
      <input id="amount" type="number" placeholder="Montant TTC">
      <select id="cat">
        <option>Transport</option>
        <option>Repas</option>
        <option>Hébergement</option>
        <option>Divers</option>
      </select>
      <button class="primary" onclick="add()">Ajouter</button>
    </div>
  </div>

  <div class="card">
    <h3>Dépenses</h3>
    <div class="body list" id="list"></div>
  </div>

</div>

<script>
const CLIENT_ID='510292526417-007bs9oh8tdif3hgkr4ov33ns7ctl5kq.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.file';
const FILE='notes_de_frais.json';

let token=null;
let expenses=JSON.parse(localStorage.getItem('ndf')||'[]');
let fileId=null;
let client;

function render(){
  const list=document.getElementById('list');
  list.innerHTML=expenses.map(e=>`
    <div class='item'>
      <div>
        <div>${e.desc}</div>
        <div class='small'>${e.date} · ${e.cat}</div>
      </div>
      <div>
        ${e.amount} € <span class='danger' onclick='del(${e.id})'>×</span>
      </div>
    </div>
  `).join('');
}

function add(){
  expenses.push({
    id:Date.now(),
    desc:desc.value,
    date:date.value,
    amount:+amount.value,
    cat:cat.value
  });
  localStorage.setItem('ndf',JSON.stringify(expenses));
  render();
  autoSave();
}

function del(id){
  expenses=expenses.filter(e=>e.id!==id);
  localStorage.setItem('ndf',JSON.stringify(expenses));
  render();
  autoSave();
}

function connect(){
  client=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:SCOPES,
    callback:(r)=>{
      token=r.access_token;
      alert('Drive connecté');
      load();
    }
  });
  client.requestAccessToken();
}

async function save(){
  if(!token)return;
  const blob=new Blob([JSON.stringify(expenses)],{type:'application/json'});

  if(fileId){
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,{
      method:'PATCH',
      headers:{Authorization:'Bearer '+token},
      body:blob
    });
  }else{
    const form=new FormData();
    form.append('metadata',new Blob([JSON.stringify({name:FILE})],{type:'application/json'}));
    form.append('file',blob);
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
      method:'POST',
      headers:{Authorization:'Bearer '+token},
      body:form
    });
    const d=await r.json();
    fileId=d.id;
  }
}

async function load(){
  const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${FILE}'&fields=files(id)`,{
    headers:{Authorization:'Bearer '+token}
  });
  const d=await r.json();
  if(!d.files.length)return;
  fileId=d.files[0].id;

  const data=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,{
    headers:{Authorization:'Bearer '+token}
  });

  expenses=await data.json();
  render();
}

let t;
function autoSave(){
  clearTimeout(t);
  t=setTimeout(save,1500);
}

render();
</script>
</body>
</html>
