<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes de Frais</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --surface2: #F0EDE6;
    --border: #E2DDD4;
    --border2: #C8C2B5;
    --text: #1A1714;
    --text2: #6B6459;
    --text3: #A09890;
    --accent: #2D5016;
    --accent-light: #E8F0DF;
    --accent-mid: #5A8A30;
    --danger: #8B2020;
    --danger-light: #F5E8E8;
    --warning: #7A5A00;
    --warning-light: #FDF6E3;
    --radius: 10px;
    --radius-lg: 16px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
    --shadow-lg: 0 4px 24px rgba(0,0,0,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── Header ── */
  header {
    background: var(--accent);
    color: #fff;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
  }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.18);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .header-actions { display: flex; gap: 8px; }
  .btn-header {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    padding: 7px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-header:hover { background: rgba(255,255,255,0.25); }

  /* ── Layout ── */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 1.5rem;
    align-items: start;
  }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
  }
  .card-header {
    padding: 1.25rem 1.5rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-title {
    font-family: 'DM Serif Display', serif;
    font-size: 17px;
    color: var(--text);
  }
  .card-body { padding: 1.25rem 1.5rem; }

  /* ── Summary strip ── */
  .summary-strip {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .metric {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    box-shadow: var(--shadow);
  }
  .metric-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); margin-bottom: 4px; }
  .metric-value { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--text); line-height: 1.1; }
  .metric-sub { font-size: 12px; color: var(--text3); margin-top: 3px; }
  .metric.accent { background: var(--accent); border-color: var(--accent); }
  .metric.accent .metric-label { color: rgba(255,255,255,0.65); }
  .metric.accent .metric-value { color: #fff; }
  .metric.accent .metric-sub { color: rgba(255,255,255,0.5); }

  /* ── Form ── */
  .field { margin-bottom: 0.875rem; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 9px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent-mid);
    box-shadow: 0 0 0 3px rgba(90,138,48,0.12);
    background: #fff;
  }
  .ht-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 11px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-primary:hover { background: #3a6820; }
  .btn-primary:active { transform: scale(0.98); }

  /* ── Filters ── */
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .filters select {
    padding: 7px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--text);
    outline: none;
    cursor: pointer;
  }
  .filter-label { font-size: 12px; color: var(--text3); font-weight: 500; }

  /* ── Expense list ── */
  .expense-list { display: flex; flex-direction: column; gap: 6px; }
  .expense-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.875rem 1rem;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.15s, box-shadow 0.15s;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform:translateY(0); } }
  .expense-item:hover { border-color: var(--border2); box-shadow: var(--shadow); }

  .cat-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
    letter-spacing: 0.03em;
  }
  .expense-body { flex: 1; min-width: 0; }
  .expense-desc { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .expense-meta { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .expense-right { text-align: right; flex-shrink: 0; }
  .expense-ttc { font-size: 15px; font-weight: 600; color: var(--text); }
  .expense-ht { font-size: 11px; color: var(--text3); }
  .btn-del {
    background: none; border: none; cursor: pointer;
    color: var(--text3); font-size: 18px; line-height: 1;
    padding: 4px 6px; border-radius: 6px;
    transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  .btn-del:hover { color: var(--danger); background: var(--danger-light); }

  /* ── By category chart ── */
  .cat-breakdown { margin-top: 1.25rem; }
  .cat-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }
  .cat-row:last-child { border-bottom: none; }
  .cat-name { font-size: 13px; color: var(--text2); min-width: 110px; }
  .cat-bar-bg { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .cat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
  .cat-pct { font-size: 11px; color: var(--text3); min-width: 32px; text-align: right; }
  .cat-total { font-size: 13px; font-weight: 600; color: var(--text); min-width: 75px; text-align: right; }

  .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text3);
    border: 2px dashed var(--border);
    border-radius: var(--radius-lg);
    font-size: 14px;
  }
  .empty-icon { font-size: 32px; margin-bottom: 0.75rem; }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: #fff;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    transition: transform 0.3s ease;
    z-index: 999;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── Save indicator ── */
  .save-dot { width: 8px; height: 8px; border-radius: 50%; background: #6FCF97; display: inline-block; margin-right: 5px; }

  /* ── Modal ── */
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 2rem;
    max-width: 440px;
    width: 90%;
    box-shadow: var(--shadow-lg);
  }
  .modal h2 { font-family: 'DM Serif Display', serif; font-size: 20px; margin-bottom: 0.5rem; }
  .modal p { font-size: 14px; color: var(--text2); margin-bottom: 1.25rem; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .btn-secondary {
    background: none; border: 1px solid var(--border2);
    border-radius: 8px; padding: 8px 16px;
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    cursor: pointer; color: var(--text2);
  }
  .btn-secondary:hover { background: var(--surface2); }
  .btn-danger {
    background: var(--danger); color: #fff;
    border: none; border-radius: 8px; padding: 8px 16px;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }

  /* ── Category colors ── */
  .cat-Transport { background: #E6F1FB; color: #0C447C; }
  .cat-bar-Transport { background: #378ADD; }
  .cat-Repas { background: #EAF3DE; color: #27500A; }
  .cat-bar-Repas { background: #639922; }
  .cat-Hébergement { background: #FAEEDA; color: #633806; }
  .cat-bar-Hébergement { background: #BA7517; }
  .cat-Télécoms { background: #EEEDFE; color: #3C3489; }
  .cat-bar-Télécoms { background: #7F77DD; }
  .cat-Fournitures { background: #FAECE7; color: #712B13; }
  .cat-bar-Fournitures { background: #D85A30; }
  .cat-Formation { background: #E1F5EE; color: #085041; }
  .cat-bar-Formation { background: #1D9E75; }
  .cat-Divers { background: #F1EFE8; color: #444441; }
  .cat-bar-Divers { background: #888780; }

  @media (max-width: 820px) {
    .container { grid-template-columns: 1fr; }
    .summary-strip { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 500px) {
    .summary-strip { grid-template-columns: 1fr; }
    header { padding: 0 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📋</div>
    Notes de Frais
  </div>
  <div class="header-actions">
    <button class="btn-header" onclick="exportCSV()">⬇ CSV</button>
    <button class="btn-header" onclick="importFile()">⬆ Importer</button>
    <button class="btn-header" onclick="confirmClear()" style="background:rgba(255,80,80,0.18);border-color:rgba(255,100,100,0.3)">🗑 Vider</button>
  </div>
</header>

<input type="file" id="import-input" accept=".json" style="display:none" onchange="doImport(event)">

<div class="container">

  <!-- LEFT: form -->
  <div>
    <div class="card" style="margin-bottom:1.25rem">
      <div class="card-header">
        <span class="card-title">Nouvelle dépense</span>
        <span><span class="save-dot"></span><span style="font-size:12px;color:var(--text3)">Sauvegarde auto</span></span>
      </div>
      <div class="card-body">
        <div class="field">
          <label>Description *</label>
          <input type="text" id="f-desc" placeholder="Ex: Taxi CDG → client">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Date *</label>
            <input type="date" id="f-date">
          </div>
          <div class="field">
            <label>Montant TTC (€) *</label>
            <input type="number" id="f-amount" placeholder="0.00" min="0" step="0.01" oninput="updateHint()">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Catégorie</label>
            <select id="f-cat">
              <option>Transport</option>
              <option>Repas</option>
              <option>Hébergement</option>
              <option>Télécoms</option>
              <option>Fournitures</option>
              <option>Formation</option>
              <option>Divers</option>
            </select>
          </div>
          <div class="field">
            <label>Taux de TVA</label>
            <select id="f-tva" onchange="updateHint()">
              <option value="20">20 % — Standard</option>
              <option value="10">10 % — Restauration</option>
              <option value="5.5">5,5 % — Réduit</option>
              <option value="0">0 % — Exonéré</option>
            </select>
            <div class="ht-hint" id="ht-hint">Montant HT : —</div>
          </div>
        </div>
        <div class="field">
          <label>Référence / Note</label>
          <input type="text" id="f-note" placeholder="N° reçu, contexte, projet…">
        </div>
        <button class="btn-primary" onclick="addExpense()">+ Ajouter la dépense</button>
      </div>
    </div>

    <!-- By category -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Répartition</span>
      </div>
      <div class="card-body" style="padding-top:0.75rem">
        <div id="cat-chart" class="cat-breakdown"></div>
      </div>
    </div>
  </div>

  <!-- RIGHT: list -->
  <div>
    <div class="summary-strip" id="summary"></div>

    <div class="filters">
      <span class="filter-label">Filtrer :</span>
      <select id="filter-cat" onchange="render()">
        <option value="">Toutes catégories</option>
        <option>Transport</option><option>Repas</option><option>Hébergement</option>
        <option>Télécoms</option><option>Fournitures</option><option>Formation</option><option>Divers</option>
      </select>
      <select id="filter-month" onchange="render()">
        <option value="">Tous les mois</option>
      </select>
    </div>

    <div class="expense-list" id="list"></div>
  </div>
</div>

<!-- Confirm modal -->
<div class="modal-bg" id="modal-clear">
  <div class="modal">
    <h2>Vider toutes les données ?</h2>
    <p>Cette action supprimera définitivement toutes vos notes de frais. Cette opération est irréversible.</p>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn-danger" onclick="clearAll()">Vider quand même</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const STORAGE_KEY = 'ndf_v2';
  let expenses = load();

  // Set today's date
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { return []; }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
  function fmt(n) {
    return n.toLocaleString('fr-FR', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €';
  }
  function updateHint() {
    const ttc = parseFloat(document.getElementById('f-amount').value) || 0;
    const tva = parseFloat(document.getElementById('f-tva').value);
    document.getElementById('ht-hint').textContent = ttc > 0
      ? 'Montant HT : ' + (ttc / (1 + tva/100)).toFixed(2) + ' €'
      : 'Montant HT : —';
  }

  function addExpense() {
    const desc = document.getElementById('f-desc').value.trim();
    const amount = parseFloat(document.getElementById('f-amount').value);
    const date = document.getElementById('f-date').value;
    const cat = document.getElementById('f-cat').value;
    const tva = parseFloat(document.getElementById('f-tva').value);
    const note = document.getElementById('f-note').value.trim();
    if (!desc) { highlight('f-desc'); return; }
    if (!amount || amount <= 0) { highlight('f-amount'); return; }
    if (!date) { highlight('f-date'); return; }
    expenses.push({ id: Date.now(), desc, amount, date, cat, tva, note });
    save();
    render();
    toast('✓ Dépense ajoutée et sauvegardée');
    document.getElementById('f-desc').value = '';
    document.getElementById('f-amount').value = '';
    document.getElementById('f-note').value = '';
    document.getElementById('ht-hint').textContent = 'Montant HT : —';
  }

  function highlight(id) {
    const el = document.getElementById(id);
    el.style.borderColor = '#c0392b';
    el.focus();
    setTimeout(() => el.style.borderColor = '', 1500);
  }

  function delExpense(id) {
    expenses = expenses.filter(e => e.id !== id);
    save(); render();
    toast('Dépense supprimée');
  }

  function filtered() {
    const cat = document.getElementById('filter-cat').value;
    const month = document.getElementById('filter-month').value;
    return expenses.filter(e => {
      if (cat && e.cat !== cat) return false;
      if (month && e.date.slice(0,7) !== month) return false;
      return true;
    });
  }

  function render() {
    const months = [...new Set(expenses.map(e => e.date.slice(0,7)))].sort().reverse();
    const fMonth = document.getElementById('filter-month');
    const curMonth = fMonth.value;
    fMonth.innerHTML = '<option value="">Tous les mois</option>' + months.map(m => {
      const [y, mo] = m.split('-');
      const label = new Date(y, mo-1).toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
      return `<option value="${m}"${m===curMonth?' selected':''}>${label.charAt(0).toUpperCase()+label.slice(1)}</option>`;
    }).join('');

    const list = filtered();
    const total = list.reduce((s,e) => s+e.amount, 0);
    const totalHT = list.reduce((s,e) => s+e.amount/(1+e.tva/100), 0);
    const totalTVA = total - totalHT;
    const count = list.length;

    document.getElementById('summary').innerHTML = `
      <div class="metric accent">
        <div class="metric-label">Total TTC</div>
        <div class="metric-value">${fmt(total)}</div>
        <div class="metric-sub">${count} dépense${count!==1?'s':''}</div>
      </div>
      <div class="metric">
        <div class="metric-label">Total HT</div>
        <div class="metric-value">${fmt(totalHT)}</div>
        <div class="metric-sub">Hors taxes</div>
      </div>
      <div class="metric">
        <div class="metric-label">TVA récupérable</div>
        <div class="metric-value">${fmt(totalTVA)}</div>
        <div class="metric-sub">Total TVA</div>
      </div>
    `;

    const listEl = document.getElementById('list');
    if (!list.length) {
      listEl.innerHTML = `<div class="empty"><div class="empty-icon">📄</div>Aucune dépense${document.getElementById('filter-cat').value||document.getElementById('filter-month').value?' pour ce filtre':''}<br><span style="font-size:12px">Ajoutez votre première note de frais</span></div>`;
    } else {
      const sorted = [...list].sort((a,b) => b.date.localeCompare(a.date));
      listEl.innerHTML = sorted.map(e => {
        const ht = e.amount/(1+e.tva/100);
        const d = new Date(e.date+'T12:00:00').toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'});
        return `<div class="expense-item">
          <span class="cat-pill cat-${CSS.escape(e.cat)}">${e.cat}</span>
          <div class="expense-body">
            <div class="expense-desc" title="${e.desc}">${e.desc}</div>
            <div class="expense-meta">${d}${e.note?' · '+e.note:''} · TVA ${e.tva}%</div>
          </div>
          <div class="expense-right">
            <div class="expense-ttc">${fmt(e.amount)}</div>
            <div class="expense-ht">HT ${ht.toFixed(2)} €</div>
          </div>
          <button class="btn-del" onclick="delExpense(${e.id})" title="Supprimer">×</button>
        </div>`;
      }).join('');
    }

    // by cat
    const byCat = {};
    list.forEach(e => { byCat[e.cat] = (byCat[e.cat]||0)+e.amount; });
    const maxAmt = Math.max(...Object.values(byCat), 0.01);
    const catEl = document.getElementById('cat-chart');
    if (!Object.keys(byCat).length) {
      catEl.innerHTML = '<div style="font-size:13px;color:var(--text3);padding:8px 0">Aucune donnée</div>';
    } else {
      catEl.innerHTML = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat, amt]) => {
        const pct = (amt/maxAmt*100).toFixed(1);
        const share = total>0 ? (amt/total*100).toFixed(0) : 0;
        return `<div class="cat-row">
          <span class="cat-name">${cat}</span>
          <div class="cat-bar-bg"><div class="cat-bar-fill cat-bar-${CSS.escape(cat)}" style="width:${pct}%"></div></div>
          <span class="cat-pct">${share}%</span>
          <span class="cat-total">${fmt(amt)}</span>
        </div>`;
      }).join('');
    }
  }

  /* ── Export CSV ── */
  function exportCSV() {
    const list = filtered();
    if (!list.length) { toast('Aucune dépense à exporter'); return; }
    const rows = [['Date','Description','Catégorie','Montant TTC (€)','TVA (%)','Montant HT (€)','Note']];
    [...list].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
      const ht = (e.amount/(1+e.tva/100)).toFixed(2);
      rows.push([e.date, e.desc, e.cat, e.amount.toFixed(2), e.tva, ht, e.note||'']);
    });
    const csv = rows.map(r => r.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
    download('\uFEFF'+csv, 'notes_de_frais.csv', 'text/csv;charset=utf-8');
    toast('✓ Export CSV téléchargé');
  }

  /* ── Export JSON (sauvegarde complète) ── */
  function exportJSON() {
    const data = JSON.stringify({ version:2, exported: new Date().toISOString(), expenses }, null, 2);
    download(data, 'notes_de_frais_sauvegarde.json', 'application/json');
    toast('✓ Sauvegarde JSON téléchargée');
  }

  function download(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  /* ── Import JSON ── */
  function importFile() {
    // offer choice: JSON backup or CSV
    const choice = confirm('Importer une sauvegarde JSON ?\n\n• OK → importer un fichier JSON de sauvegarde\n• Annuler → exporter la sauvegarde JSON à la place');
    if (choice) {
      document.getElementById('import-input').click();
    } else {
      exportJSON();
    }
  }

  function doImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        const imported = data.expenses || data;
        if (!Array.isArray(imported)) throw new Error('Format invalide');
        const merge = confirm(`Importer ${imported.length} dépense(s) ?\n\n• OK → fusionner avec les données existantes\n• Annuler → remplacer toutes les données`);
        if (merge) {
          const ids = new Set(expenses.map(x=>x.id));
          imported.forEach(e => { if (!ids.has(e.id)) expenses.push(e); });
        } else {
          expenses = imported;
        }
        save(); render();
        toast(`✓ ${imported.length} dépense(s) importées`);
      } catch(err) {
        alert('Fichier invalide : ' + err.message);
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  /* ── Clear ── */
  function confirmClear() { document.getElementById('modal-clear').classList.add('open'); }
  function closeModal() { document.getElementById('modal-clear').classList.remove('open'); }
  function clearAll() {
    expenses = [];
    save(); render();
    closeModal();
    toast('Toutes les données ont été supprimées');
  }

  // Close modal on bg click
  document.getElementById('modal-clear').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // Enter key on form
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('f-')) addExpense();
  });

  render();
</script>
</body>
